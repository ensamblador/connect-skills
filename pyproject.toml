[project]
name = "connect-knowledge"
version = "0.1.0"
description = "Search tools for Amazon Connect documentation, blogs, and re:Post"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "connect-knowledge-mcp",
]

[project.optional-dependencies]
deploy = [
    "boto3>=1.34",
]
tools = [
    "playwright>=1.46",
]
# Dev/test dependencies: property-based tests (hypothesis) + runner (pytest)
# for the connect-iac-cdk spec. Install with: uv sync --extra dev
dev = [
    "hypothesis>=6.0",
    "pytest>=8.0",
]

[project.scripts]
connect-docs-search = "connect_knowledge.cli:docs_main"
connect-blog-search = "connect_knowledge.cli:blogs_main"
connect-repost-search = "connect_knowledge.cli:repost_main"

[tool.uv.sources]
connect-knowledge-mcp = { path = "connect_knowledge_mcp", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
