[project]
name = "connect-knowledge"
version = "0.1.0"
description = "Search tools for Amazon Connect documentation, blogs, and re:Post"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
deploy = [
    "boto3>=1.34",
]

[project.scripts]
connect-docs-search = "connect_knowledge.cli:docs_main"
connect-blog-search = "connect_knowledge.cli:blogs_main"
connect-repost-search = "connect_knowledge.cli:repost_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connect_knowledge"]
