[project]
name = "cdk-docs-mcp"
version = "0.1.0"
description = "MCP server exposing AWS CDK (Python) reference docs for the in-scope Connect construct libraries"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.14.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.scripts]
cdk-docs-search = "cdk_docs.cli:docs_main"
cdk-construct-doc = "cdk_docs.cli:construct_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cdk_docs"]
